name: Sync assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - ".github/workflows/sync-assets.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-assets
  cancel-in-progress: false

# Deliberately no `environment:` block on this job. Setting one changes the
# OIDC token's sub claim from repo:bsoyka/bsoyka:ref:refs/heads/main to
# repo:bsoyka/bsoyka:environment:<name>, which the IAM role's trust policy
# (infra/iam.tf) doesn't match -- every run fails to assume the role. The
# `production` environment has no protection rules anyway, so there's nothing
# to gain by declaring one here.
jobs:
  sync:
    name: Sync to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync assets to S3
        run: |
          aws s3 sync assets/ "s3://${{ vars.ASSETS_BUCKET }}/" \
            --delete \
            --exclude "*.gitkeep" \
            --exclude "*.DS_Store" \
            --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
